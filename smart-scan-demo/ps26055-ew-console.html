<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS26055 :: Smart Scan Strategy — EW Simulation Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-void:#050810;
  --bg-panel:#0A1220;
  --bg-panel-raised:#0E1A2E;
  --bg-panel-deep:#071019;
  --border-steel:#1B324A;
  --border-steel-bright:#2D5578;
  --text-primary:#D8E4EE;
  --text-dim:#5E7B96;
  --text-faint:#3D5468;
  --cyan-signal:#4DD8E8;
  --cyan-bright:#8FEFFA;
  --cyan-dim:#164654;
  --amber-warn:#E8B84D;
  --red-critical:#E8604D;
  --green-confirm:#4DE87F;
  --grid-line:#101C2C;
  --font-ui:'IBM Plex Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg-void);color:var(--text-primary);font-family:var(--font-ui);font-size:13px;height:100%;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg-void);}
::-webkit-scrollbar-thumb{background:var(--border-steel);}
::-webkit-scrollbar-thumb:hover{background:var(--border-steel-bright);}

.app{display:flex;height:100vh;width:100vw;}

/* ===== NAV ===== */
.nav{
  width:196px;flex-shrink:0;background:var(--bg-panel-deep);
  border-right:1px solid var(--border-steel);
  display:flex;flex-direction:column;
}
.nav-brand{
  padding:16px 14px 12px;border-bottom:1px solid var(--border-steel);
}
.nav-brand .code{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--cyan-signal);letter-spacing:0.5px;}
.nav-brand .sub{font-size:10px;color:var(--text-dim);margin-top:3px;line-height:1.4;}
.nav-list{flex:1;overflow-y:auto;padding:8px 0;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  color:var(--text-dim);font-size:11.5px;font-weight:500;letter-spacing:0.3px;
  border-left:2px solid transparent;cursor:pointer;user-select:none;
  transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--bg-panel);color:var(--text-primary);}
.nav-item.active{
  background:var(--bg-panel-raised);color:var(--cyan-signal);
  border-left:2px solid var(--cyan-signal);
}
.nav-item .ic{width:14px;height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.nav-item .ic svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;}
.nav-num{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);width:14px;}
.nav-item.active .nav-num{color:var(--cyan-signal);}
.nav-foot{
  padding:10px 14px;border-top:1px solid var(--border-steel);
  font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);line-height:1.6;
}
.nav-foot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green-confirm);margin-right:5px;box-shadow:0 0 4px var(--green-confirm);}

/* ===== MAIN ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{
  height:44px;flex-shrink:0;border-bottom:1px solid var(--border-steel);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;background:var(--bg-panel-deep);
}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-title{font-size:12.5px;font-weight:600;color:var(--text-primary);}
.topbar-crumb{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);}
.topbar-right{display:flex;align-items:center;gap:16px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);}
.topbar-stat{display:flex;align-items:center;gap:5px;}
.topbar-stat .val{color:var(--cyan-signal);font-weight:600;}
.clock-live{color:var(--green-confirm);}

.page{flex:1;overflow-y:auto;padding:16px 20px 40px;}
.page-hidden{display:none;}

/* ===== SHARED PANEL SYSTEM ===== */
.panel{
  background:var(--bg-panel);border:1px solid var(--border-steel);
  margin-bottom:14px;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 13px;border-bottom:1px solid var(--border-steel);
  background:var(--bg-panel-raised);
}
.panel-title{font-size:11px;font-weight:600;letter-spacing:0.4px;color:var(--text-primary);}
.panel-title .unit{color:var(--text-faint);font-weight:400;margin-left:6px;font-family:var(--font-mono);font-size:9.5px;}
.panel-tag{
  font-family:var(--font-mono);font-size:9px;padding:2px 6px;border:1px solid var(--border-steel-bright);
  color:var(--text-dim);letter-spacing:0.5px;
}
.panel-tag.live{color:var(--green-confirm);border-color:var(--green-confirm);}
.panel-tag.sim{color:var(--amber-warn);border-color:var(--amber-warn);}
.panel-body{padding:14px;}

.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-12{grid-template-columns:repeat(12,1fr);}
.col-8{grid-column:span 8;}
.col-4{grid-column:span 4;}
.col-6{grid-column:span 6;}
.col-12{grid-column:span 12;}
.col-3{grid-column:span 3;}
.col-9{grid-column:span 9;}

/* Metric tiles */
.metric{
  background:var(--bg-panel);border:1px solid var(--border-steel);
  padding:12px 14px;
}
.metric-label{font-size:9.5px;color:var(--text-dim);letter-spacing:0.5px;margin-bottom:6px;}
.metric-value{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--text-primary);line-height:1;}
.metric-value.cyan{color:var(--cyan-signal);}
.metric-value.green{color:var(--green-confirm);}
.metric-value.amber{color:var(--amber-warn);}
.metric-value.red{color:var(--red-critical);}
.metric-sub{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);margin-top:4px;}

/* Status pills */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);
  font-size:9.5px;padding:3px 8px;border:1px solid var(--border-steel);letter-spacing:0.4px;
}
.pill .d{width:5px;height:5px;border-radius:50%;}
.pill.pass{color:var(--green-confirm);border-color:var(--green-confirm);}
.pill.pass .d{background:var(--green-confirm);box-shadow:0 0 4px var(--green-confirm);}
.pill.warn{color:var(--amber-warn);border-color:var(--amber-warn);}
.pill.warn .d{background:var(--amber-warn);box-shadow:0 0 4px var(--amber-warn);}
.pill.fail{color:var(--red-critical);border-color:var(--red-critical);}
.pill.fail .d{background:var(--red-critical);box-shadow:0 0 4px var(--red-critical);}
.pill.notval{color:var(--text-dim);border-color:var(--border-steel);}
.pill.notval .d{background:var(--text-dim);}

/* Tables */
table.datagrid{width:100%;border-collapse:collapse;font-size:11px;}
table.datagrid th{
  text-align:left;font-size:9.5px;color:var(--text-dim);font-weight:500;letter-spacing:0.4px;
  padding:7px 10px;border-bottom:1px solid var(--border-steel-bright);background:var(--bg-panel-raised);
  position:sticky;top:0;
}
table.datagrid td{
  padding:6px 10px;border-bottom:1px solid var(--border-steel);color:var(--text-primary);
  font-family:var(--font-mono);font-size:10.5px;
}
table.datagrid tr:hover td{background:var(--bg-panel-raised);}
.mono{font-family:var(--font-mono);}
.dim{color:var(--text-dim);}
.faint{color:var(--text-faint);}

.badge-type{
  font-family:var(--font-mono);font-size:9px;padding:2px 6px;border:1px solid var(--border-steel);
  color:var(--text-dim);white-space:nowrap;
}
.badge-type.periodic{color:var(--cyan-signal);border-color:var(--cyan-dim);}
.badge-type.scanning{color:var(--amber-warn);border-color:#5c4a1f;}
.badge-type.intermittent{color:#B48DE8;border-color:#3d2f5c;}
.badge-type.agile{color:var(--red-critical);border-color:#5c2b1f;}

.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;}
.status-dot.active{background:var(--green-confirm);box-shadow:0 0 4px var(--green-confirm);}
.status-dot.idle{background:var(--text-faint);}
.status-dot.detected{background:var(--cyan-signal);box-shadow:0 0 4px var(--cyan-signal);}

/* Buttons */
.btn{
  font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:0.4px;
  padding:8px 16px;border:1px solid var(--border-steel-bright);background:var(--bg-panel-raised);
  color:var(--text-primary);transition:all .12s;
}
.btn:hover{border-color:var(--cyan-signal);color:var(--cyan-signal);}
.btn.primary{background:var(--cyan-dim);border-color:var(--cyan-signal);color:var(--cyan-bright);}
.btn.primary:hover{background:#1d5b68;}
.btn.stop{border-color:var(--red-critical);color:var(--red-critical);}
.btn.stop:hover{background:#3a1912;}
.btn.small{padding:5px 10px;font-size:9.5px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}

.field-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.field-label{font-size:10px;color:var(--text-dim);letter-spacing:0.3px;display:flex;justify-content:space-between;}
.field-label .fv{font-family:var(--font-mono);color:var(--cyan-signal);}
input[type=range]{
  width:100%;height:3px;background:var(--border-steel);appearance:none;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:11px;height:11px;background:var(--cyan-signal);border-radius:50%;cursor:pointer;
  box-shadow:0 0 6px rgba(77,216,232,.6);
}
input[type=number],input[type=text],select{
  background:var(--bg-panel-deep);border:1px solid var(--border-steel);color:var(--text-primary);
  padding:6px 9px;font-family:var(--font-mono);font-size:11px;outline:none;width:100%;
}
input[type=number]:focus,input[type=text]:focus,select:focus{border-color:var(--cyan-signal);}

.section-label{
  font-size:10px;font-weight:600;color:var(--text-dim);letter-spacing:0.6px;
  padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--border-steel);
}

.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:10px;color:var(--text-dim);}
.legend-item{display:flex;align-items:center;gap:5px;}
.legend-swatch{width:9px;height:9px;flex-shrink:0;}

.flow-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-mono);font-size:10.5px;}
.flow-node{
  padding:6px 12px;border:1px solid var(--border-steel-bright);background:var(--bg-panel-raised);color:var(--text-primary);
  white-space:nowrap;
}
.flow-node.active{border-color:var(--cyan-signal);color:var(--cyan-signal);}
.flow-arrow{color:var(--text-faint);}

.tabbar{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--border-steel);}
.tab{
  padding:8px 14px;font-size:11px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;
  font-weight:500;letter-spacing:0.3px;
}
.tab:hover{color:var(--text-primary);}
.tab.active{color:var(--cyan-signal);border-bottom-color:var(--cyan-signal);}

.data-note{
  font-size:10px;color:var(--text-faint);font-family:var(--font-mono);display:flex;align-items:center;gap:6px;
  padding:7px 10px;background:var(--bg-panel-deep);border:1px dashed var(--border-steel);margin-top:8px;
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="nav-brand">
      <div class="code">PS26055</div>
      <div class="sub">Smart Scan Strategy<br>for Electronic Warfare</div>
    </div>
    <div class="nav-list" id="navList"></div>
    <div class="nav-foot"><span class="dot"></span>SIM ENGINE ONLINE<br>BUILD 0.9.3-research</div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="topbarTitle">Mission Overview</span>
        <span class="topbar-crumb" id="topbarCrumb">/ PS26055 / MISSION</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-stat">T+<span class="val mono clock-live" id="simClock">00:14:22.410</span></div>
        <div class="topbar-stat">SCENARIO <span class="val" id="topbarScenario">SC-0417-B</span></div>
        <div class="topbar-stat">SEED <span class="val" id="topbarSeed">88214</span></div>
      </div>
    </div>
    <div class="page" id="pageRoot"></div>
  </div>
</div>
<script>
// ===== app.js =====
// ============ NAV CONFIG ============
const PAGES = [
  {id:'mission', num:'01', label:'MISSION', title:'Mission Overview', crumb:'/ PS26055 / MISSION', icon:'crosshair'},
  {id:'spectrum', num:'02', label:'SPECTRUM', title:'RF Spectrum Monitor', crumb:'/ PS26055 / SPECTRUM', icon:'wave'},
  {id:'emitters', num:'03', label:'EMITTERS', title:'Emitter Environment', crumb:'/ PS26055 / EMITTERS', icon:'grid'},
  {id:'simulation', num:'04', label:'SIMULATION', title:'Simulation Control', crumb:'/ PS26055 / SIMULATION', icon:'sliders'},
  {id:'strategy', num:'05', label:'STRATEGIES', title:'Scan Strategy Lab', crumb:'/ PS26055 / STRATEGIES', icon:'target'},
  {id:'comparison', num:'06', label:'COMPARISON', title:'Algorithm Comparison', crumb:'/ PS26055 / COMPARISON', icon:'bars'},
  {id:'tsrd', num:'07', label:'TSRD', title:'TSRD / Dataset Analysis', crumb:'/ PS26055 / TSRD', icon:'db'},
  {id:'pdw', num:'08', label:'PDW', title:'PDW Analysis', crumb:'/ PS26055 / PDW', icon:'pulse'},
  {id:'detection', num:'09', label:'DETECTION', title:'Detection & Interception Analytics', crumb:'/ PS26055 / DETECTION', icon:'eye'},
  {id:'experiments', num:'10', label:'EXPERIMENTS', title:'Experiment Results', crumb:'/ PS26055 / EXPERIMENTS', icon:'flask'},
  {id:'validation', num:'11', label:'VALIDATION', title:'System / Validation Status', crumb:'/ PS26055 / VALIDATION', icon:'check'},
];

const ICONS = {
  crosshair:'<circle cx="7" cy="7" r="5.5"/><line x1="7" y1="0.5" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13.5"/><line x1="0.5" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13.5" y2="7"/>',
  wave:'<path d="M0.5 7 L3 7 L4.5 2 L6.5 12 L8 4 L9.5 10 L11 7 L13.5 7"/>',
  grid:'<rect x="1" y="1" width="5" height="5"/><rect x="8" y="1" width="5" height="5"/><rect x="1" y="8" width="5" height="5"/><rect x="8" y="8" width="5" height="5"/>',
  sliders:'<line x1="2" y1="1" x2="2" y2="13"/><circle cx="2" cy="5" r="1.5" fill="currentColor" stroke="none"/><line x1="7" y1="1" x2="7" y2="13"/><circle cx="7" cy="9" r="1.5" fill="currentColor" stroke="none"/><line x1="12" y1="1" x2="12" y2="13"/><circle cx="12" cy="4" r="1.5" fill="currentColor" stroke="none"/>',
  target:'<circle cx="7" cy="7" r="6"/><circle cx="7" cy="7" r="3"/><circle cx="7" cy="7" r="0.7" fill="currentColor" stroke="none"/>',
  bars:'<line x1="2" y1="12" x2="2" y2="6"/><line x1="7" y1="12" x2="7" y2="2"/><line x1="12" y1="12" x2="12" y2="8"/>',
  db:'<ellipse cx="7" cy="3" rx="5.5" ry="2"/><path d="M1.5 3 L1.5 11 C1.5 12.1 4 13 7 13 C10 13 12.5 12.1 12.5 11 L12.5 3"/><path d="M1.5 7 C1.5 8.1 4 9 7 9 C10 9 12.5 8.1 12.5 7"/>',
  pulse:'<polyline points="0.5,7 3,7 5,2 7,12 9,4 10.5,7 13.5,7"/>',
  eye:'<path d="M0.5 7 C2.5 3 5 1.5 7 1.5 C9 1.5 11.5 3 13.5 7 C11.5 11 9 12.5 7 12.5 C5 12.5 2.5 11 0.5 7 Z"/><circle cx="7" cy="7" r="2"/>',
  flask:'<path d="M5 1 L5 6 L1.5 12.5 C1.2 13 1.5 13.5 2 13.5 L12 13.5 C12.5 13.5 12.8 13 12.5 12.5 L9 6 L9 1"/><line x1="4" y1="1" x2="10" y2="1"/><line x1="3.5" y1="10" x2="10.5" y2="10"/>',
  check:'<path d="M1.5 7.5 L5 11 L12.5 2.5"/>',
};

function iconSvg(name){
  return `<svg viewBox="0 0 14 14">${ICONS[name]||''}</svg>`;
}

// ============ SEEDED RNG (for deterministic-looking sim data) ============
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(88214);

// ============ GLOBAL SIM STATE (simulated/placeholder) ============
const SIM = {
  simTimeMs: 14 * 60000 + 22 * 1000 + 410,
  running: true,
  scenario: 'SC-0417-B',
  seed: 88214,
  bands: 12,
  freqMin: 2.0, // GHz
  freqMax: 18.0,
  detectionCount: 842,
  interceptRate: 0.734,
  falseAlarmRate: 0.021,
  avgInterceptTimeMs: 186,
};

function fmtClock(ms){
  const h = Math.floor(ms/3600000);
  const m = Math.floor((ms%3600000)/60000);
  const s = Math.floor((ms%60000)/1000);
  const cs = Math.floor((ms%1000));
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(3,'0')}`;
}

// ============ NAV RENDER ============
function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = PAGES.map(p=>`
    <div class="nav-item ${p.id===currentPage?'active':''}" data-page="${p.id}">
      <span class="nav-num">${p.num}</span>
      <span class="ic">${iconSvg(p.icon)}</span>
      <span>${p.label}</span>
    </div>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>navigateTo(el.dataset.page));
  });
}

let currentPage = 'mission';

function navigateTo(id){
  currentPage = id;
  const p = PAGES.find(x=>x.id===id);
  document.getElementById('topbarTitle').textContent = p.title;
  document.getElementById('topbarCrumb').textContent = p.crumb;
  renderNav();
  renderPage(id);
}

// ============ CLOCK TICK ============
setInterval(()=>{
  if(SIM.running){
    SIM.simTimeMs += 410 + Math.floor(rng()*40);
    document.getElementById('simClock').textContent = fmtClock(SIM.simTimeMs);
  }
}, 400);

// ============ BOOT ============
// Boot happens explicitly at the end of index.html after all page-renderer
// scripts have loaded, since renderPage() depends on functions defined there.


// ===== rf-viz.js =====
// ============ SYNTHETIC EMITTER MODEL (SIMULATED / PLACEHOLDER DATA) ============
const EMITTER_TYPES = ['PERIODIC','SCANNING','INTERMITTENT','AGILE'];
const EMITTER_NAMES = ['EM','NX','KX','VS','RD'];

function genEmitters(n, seed){
  const r = mulberry32(seed);
  const list = [];
  for(let i=0;i<n;i++){
    const type = EMITTER_TYPES[Math.floor(r()*EMITTER_TYPES.length)];
    const freq = 2.0 + r()*16.0;
    list.push({
      id: `${EMITTER_NAMES[i%EMITTER_NAMES.length]}-${String(100+i).padStart(3,'0')}`,
      type,
      freq: freq,
      pri: (50 + r()*900).toFixed(1),
      pw: (0.2 + r()*4.8).toFixed(2),
      power: (-30 + r()*50).toFixed(1),
      active: r() > 0.15,
      agility: type==='AGILE' ? (5+Math.floor(r()*40)) : 0,
      detected: r() > 0.3,
      seedOffset: r()*1000,
    });
  }
  return list;
}

const EMITTERS = genEmitters(24, 88214);

// ============ SPECTROGRAM / TIME-FREQUENCY PLOT ============
// Renders pulses as short cyan traces on a freq(y) vs time(x) grid.
function renderSpectrogram(opts){
  const {width=900, height=340, emitters=EMITTERS, seed=1, showScanWindow=true, showDetections=true, freqMin=2, freqMax=18} = opts;
  const r = mulberry32(seed);
  const padL=48, padR=12, padT=10, padB=24;
  const plotW = width-padL-padR, plotH = height-padT-padB;

  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">`;

  // grid background
  svg += `<rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="var(--bg-panel-deep)" />`;
  const nHLines = 8;
  for(let i=0;i<=nHLines;i++){
    const y = padT + plotH*i/nHLines;
    const f = freqMax - (freqMax-freqMin)*i/nHLines;
    svg += `<line x1="${padL}" y1="${y}" x2="${padL+plotW}" y2="${y}" stroke="var(--grid-line)" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-family="var(--font-mono)" font-size="8.5" fill="var(--text-faint)">${f.toFixed(1)}</text>`;
  }
  const nVLines = 12;
  for(let i=0;i<=nVLines;i++){
    const x = padL + plotW*i/nVLines;
    svg += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+plotH}" stroke="var(--grid-line)" stroke-width="1"/>`;
    if(i%2===0) svg += `<text x="${x}" y="${height-8}" text-anchor="middle" font-family="var(--font-mono)" font-size="8.5" fill="var(--text-faint)">${(i*1.2).toFixed(1)}s</text>`;
  }
  svg += `<text x="${padL+plotW/2}" y="${height-1}" text-anchor="middle" font-family="var(--font-mono)" font-size="8" fill="var(--text-faint)">SIMULATION TIME</text>`;

  function fy(f){ return padT + plotH*(1-(f-freqMin)/(freqMax-freqMin)); }

  // emitter pulse trains
  emitters.forEach((em,idx)=>{
    const baseY = fy(em.freq);
    const colorActive = em.detected ? 'var(--cyan-bright)' : 'var(--cyan-signal)';
    const opacity = em.active ? 0.9 : 0.25;
    if(em.type==='AGILE'){
      // hopping trajectory: series of short segments at varying freq
      let x = padL;
      let prevY = baseY;
      const segs = 14;
      for(let s=0;s<segs;s++){
        const segW = plotW/segs;
        const hopF = freqMin + r()*(freqMax-freqMin);
        const y = fy(hopF);
        if(r() > 0.3){
          svg += `<line x1="${x}" y1="${y}" x2="${x+segW*0.7}" y2="${y}" stroke="${colorActive}" stroke-width="1.6" opacity="${opacity}" stroke-linecap="round"/>`;
          if(em.detected && r()>0.5) svg += `<circle cx="${x+segW*0.35}" cy="${y}" r="2.2" fill="var(--green-confirm)" opacity="0.9"/>`;
        }
        x += segW;
      }
    } else if(em.type==='SCANNING'){
      // visibility windows: pulse bursts appear in intervals
      const nBursts = 5;
      for(let b=0;b<nBursts;b++){
        if(r()>0.35){
          const x = padL + plotW*(b/nBursts) + r()*20;
          const w = 14+r()*20;
          svg += `<rect x="${x}" y="${baseY-1.5}" width="${w}" height="3" fill="${colorActive}" opacity="${opacity*0.8}"/>`;
          for(let p=0;p<4;p++){
            svg += `<line x1="${x+p*w/4}" y1="${baseY-4}" x2="${x+p*w/4}" y2="${baseY+4}" stroke="${colorActive}" stroke-width="1" opacity="${opacity}"/>`;
          }
        }
      }
    } else if(em.type==='INTERMITTENT'){
      const nBursts = 4+Math.floor(r()*3);
      for(let b=0;b<nBursts;b++){
        const x = padL + r()*plotW*0.9;
        const w = 8+r()*30;
        svg += `<rect x="${x}" y="${baseY-1.2}" width="${w}" height="2.4" fill="${colorActive}" opacity="${opacity}"/>`;
        // pulse markers
        const nP = Math.floor(w/6);
        for(let p=0;p<nP;p++){
          svg += `<line x1="${x+p*6}" y1="${baseY-3.5}" x2="${x+p*6}" y2="${baseY+3.5}" stroke="${colorActive}" stroke-width="0.9" opacity="${opacity}"/>`;
        }
      }
    } else { // PERIODIC
      const nP = Math.floor(plotW/(6+r()*5));
      const spacing = plotW/nP;
      for(let p=0;p<nP;p++){
        const x = padL + p*spacing;
        svg += `<line x1="${x}" y1="${baseY-4}" x2="${x}" y2="${baseY+4}" stroke="${colorActive}" stroke-width="1.1" opacity="${opacity}"/>`;
      }
      svg += `<line x1="${padL}" y1="${baseY}" x2="${padL+plotW}" y2="${baseY}" stroke="${colorActive}" stroke-width="0.5" opacity="${opacity*0.35}"/>`;
    }
  });

  // receiver scan window: moving translucent band
  if(showScanWindow){
    const scanX = padL + plotW*0.62;
    const scanF = 6.4;
    const scanY = fy(scanF);
    svg += `<rect x="${scanX-2}" y="${padT}" width="26" height="${plotH}" fill="var(--cyan-signal)" opacity="0.06"/>`;
    svg += `<line x1="${scanX-2}" y1="${padT}" x2="${scanX-2}" y2="${padT+plotH}" stroke="var(--cyan-bright)" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>`;
    svg += `<rect x="${scanX-2}" y="${scanY-6}" width="26" height="12" fill="none" stroke="var(--cyan-bright)" stroke-width="1.4"/>`;
    svg += `<text x="${scanX+11}" y="${padT-1}" text-anchor="middle" font-family="var(--font-mono)" font-size="8" fill="var(--cyan-bright)">RX SCAN</text>`;
  }

  // detection markers
  if(showDetections){
    for(let i=0;i<10;i++){
      const x = padL + r()*plotW;
      const y = padT + r()*plotH;
      if(r()>0.5){
        svg += `<circle cx="${x}" cy="${y}" r="3" fill="none" stroke="var(--green-confirm)" stroke-width="1.4" opacity="0.85"/>`;
      } else {
        svg += `<circle cx="${x}" cy="${y}" r="2.5" fill="none" stroke="var(--red-critical)" stroke-width="1.2" opacity="0.6" stroke-dasharray="1.5,1.5"/>`;
      }
    }
  }

  svg += `</svg>`;
  return svg;
}

// ============ AMPLITUDE VS FREQUENCY PLOT ============
function renderAmplitudeSpectrum(opts){
  const {width=900, height=160, seed=2, freqMin=2, freqMax=18} = opts;
  const r = mulberry32(seed);
  const padL=48, padR=12, padT=10, padB=20;
  const plotW=width-padL-padR, plotH=height-padT-padB;
  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">`;
  svg += `<rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="var(--bg-panel-deep)"/>`;
  for(let i=0;i<=4;i++){
    const y = padT+plotH*i/4;
    svg += `<line x1="${padL}" y1="${y}" x2="${padL+plotW}" y2="${y}" stroke="var(--grid-line)" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-family="var(--font-mono)" font-size="8" fill="var(--text-faint)">${(-i*20)}</text>`;
  }
  // noise floor baseline with jitter
  const N = 220;
  let path = `M ${padL} ${padT+plotH-8}`;
  const points = [];
  for(let i=0;i<=N;i++){
    const x = padL + plotW*i/N;
    const noise = plotH - 10 - r()*6;
    points.push([x,noise+padT-plotH+plotH]);
  }
  // build noise floor line
  let d = `M ${padL} ${padT+plotH*0.92}`;
  for(let i=1;i<=N;i++){
    const x = padL+plotW*i/N;
    const y = padT+plotH*0.92 + (r()-0.5)*6;
    d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  svg += `<path d="${d}" stroke="var(--text-faint)" stroke-width="1" fill="none" opacity="0.5"/>`;
  svg += `<text x="${padL+4}" y="${padT+plotH*0.92-4}" font-family="var(--font-mono)" font-size="7.5" fill="var(--text-faint)">NOISE FLOOR</text>`;

  // emitter peaks
  EMITTERS.slice(0,16).forEach(em=>{
    const fx = padL + plotW*(em.freq-freqMin)/(freqMax-freqMin);
    const amp = parseFloat(em.power);
    const peakY = padT + plotH*(1-(amp+30)/50);
    const w = 3+r()*4;
    const color = em.detected ? 'var(--cyan-signal)' : 'var(--cyan-dim)';
    svg += `<path d="M ${fx-w} ${padT+plotH*0.92} Q ${fx} ${peakY} ${fx+w} ${padT+plotH*0.92}" fill="none" stroke="${color}" stroke-width="1.4" opacity="0.85"/>`;
    if(em.detected){
      svg += `<circle cx="${fx}" cy="${peakY}" r="1.8" fill="var(--green-confirm)"/>`;
    }
  });
  for(let i=0;i<=4;i++){
    const x = padL+plotW*i/4;
    const f = freqMin+(freqMax-freqMin)*i/4;
    svg += `<text x="${x}" y="${height-4}" text-anchor="middle" font-family="var(--font-mono)" font-size="8" fill="var(--text-faint)">${f.toFixed(1)}</text>`;
  }
  svg += `<text x="${padL+plotW/2}" y="${height+2}" text-anchor="middle" font-family="var(--font-mono)" font-size="7.5" fill="var(--text-faint)" style="display:none"></text>`;
  svg += `</svg>`;
  return svg;
}

// ============ FREQUENCY BAND HEATMAP (for Scan Strategy Lab) ============
function renderBandHeatmap(nBands, seed){
  const r = mulberry32(seed);
  const rows = [];
  for(let i=0;i<nBands;i++){
    const activity = r();
    const confidence = r();
    rows.push({
      band: i+1,
      freqLo: (2 + i*(16/nBands)).toFixed(2),
      freqHi: (2 + (i+1)*(16/nBands)).toFixed(2),
      activity, confidence,
      lastHit: (r()*8).toFixed(1),
      sinceObs: (r()*4).toFixed(1),
    });
  }
  return rows;
}

// ============ PDW RECORD GENERATOR ============
function genPDWStream(n, seed){
  const r = mulberry32(seed);
  const rows = [];
  let t = 0;
  for(let i=0;i<n;i++){
    t += r()*8;
    const em = EMITTERS[Math.floor(r()*EMITTERS.length)];
    rows.push({
      t: t.toFixed(3),
      freq: (em.freq + (r()-0.5)*0.05).toFixed(3),
      pw: em.pw,
      amp: (-20-r()*40).toFixed(1),
      pri: em.pri,
      snr: (4+r()*22).toFixed(1),
      emitter: em.id,
      detected: r() > 0.25,
    });
  }
  return rows;
}

// ============ SCAN TIMELINE (which band selected over time) ============
function renderScanTimeline(width, height, nBands, seed){
  const r = mulberry32(seed);
  const padL=40, padR=8, padT=6, padB=16;
  const plotW=width-padL-padR, plotH=height-padT-padB;
  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">`;
  svg += `<rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="var(--bg-panel-deep)"/>`;
  const nSteps = 60;
  const stepW = plotW/nSteps;
  for(let i=0;i<nSteps;i++){
    const band = Math.floor(r()*nBands);
    const hit = r()>0.6;
    const y = padT + plotH*(band/nBands);
    const bh = plotH/nBands;
    const color = hit ? 'var(--green-confirm)' : 'var(--cyan-dim)';
    svg += `<rect x="${padL+i*stepW}" y="${y}" width="${stepW-1}" height="${bh-1}" fill="${color}" opacity="${hit?0.85:0.5}"/>`;
  }
  for(let b=0;b<=nBands;b+=2){
    const y = padT+plotH*(b/nBands);
    svg += `<text x="${padL-5}" y="${y+3}" text-anchor="end" font-family="var(--font-mono)" font-size="7.5" fill="var(--text-faint)">B${b}</text>`;
  }
  svg += `</svg>`;
  return svg;
}

// ============ SIMPLE LINE CHART (generic) ============
function renderLineChart(opts){
  const {width=420,height=180,series=[],yMin=0,yMax=1,yLabel='',color='var(--cyan-signal)',xLabels=[]} = opts;
  const padL=36,padR=10,padT=10,padB=18;
  const plotW=width-padL-padR, plotH=height-padT-padB;
  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">`;
  svg += `<rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="var(--bg-panel-deep)"/>`;
  for(let i=0;i<=4;i++){
    const y = padT+plotH*i/4;
    svg += `<line x1="${padL}" y1="${y}" x2="${padL+plotW}" y2="${y}" stroke="var(--grid-line)" stroke-width="1"/>`;
    svg += `<text x="${padL-5}" y="${y+3}" text-anchor="end" font-family="var(--font-mono)" font-size="7.5" fill="var(--text-faint)">${(yMax-(yMax-yMin)*i/4).toFixed(2)}</text>`;
  }
  const colors = Array.isArray(color) ? color : [color];
  series.forEach((s,si)=>{
    let d='';
    s.forEach((v,i)=>{
      const x = padL+plotW*i/(s.length-1);
      const y = padT+plotH*(1-(v-yMin)/(yMax-yMin));
      d += (i===0?'M':'L')+` ${x.toFixed(1)} ${y.toFixed(1)} `;
    });
    svg += `<path d="${d}" fill="none" stroke="${colors[si%colors.length]}" stroke-width="1.6" opacity="0.9"/>`;
  });
  svg += `</svg>`;
  return svg;
}

function renderBarChart(opts){
  const {width=420,height=180,values=[],labels=[],color='var(--cyan-signal)',yMax=null} = opts;
  const padL=36,padR=10,padT=10,padB=22;
  const plotW=width-padL-padR, plotH=height-padT-padB;
  const max = yMax || Math.max(...values)*1.15;
  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">`;
  svg += `<rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="var(--bg-panel-deep)"/>`;
  for(let i=0;i<=4;i++){
    const y = padT+plotH*i/4;
    svg += `<line x1="${padL}" y1="${y}" x2="${padL+plotW}" y2="${y}" stroke="var(--grid-line)" stroke-width="1"/>`;
  }
  const bw = plotW/values.length;
  const colors = Array.isArray(color) ? color : values.map(()=>color);
  values.forEach((v,i)=>{
    const h = plotH*(v/max);
    const x = padL+i*bw+bw*0.15;
    svg += `<rect x="${x}" y="${padT+plotH-h}" width="${bw*0.7}" height="${h}" fill="${colors[i]}" opacity="0.85"/>`;
    svg += `<text x="${x+bw*0.35}" y="${height-6}" text-anchor="middle" font-family="var(--font-mono)" font-size="7.5" fill="var(--text-dim)">${labels[i]||''}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function renderEmitterTimeline(width,height){
  const padL=90,padR=12,padT=8,padB=8;
  const plotW=width-padL-padR, plotH=height-padT-padB;
  const rowH = plotH/EMITTERS.length;
  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">`;
  EMITTERS.forEach((em,idx)=>{
    const y = padT+idx*rowH;
    const r = mulberry32(300+idx);
    svg += `<text x="${padL-6}" y="${y+rowH/2+3}" text-anchor="end" font-family="var(--font-mono)" font-size="8" fill="var(--text-dim)">${em.id}</text>`;
    svg += `<rect x="${padL}" y="${y}" width="${plotW}" height="${rowH-1}" fill="var(--bg-panel-deep)"/>`;
    const color = em.type==='PERIODIC'?'var(--cyan-signal)':em.type==='SCANNING'?'var(--amber-warn)':em.type==='INTERMITTENT'?'#B48DE8':'var(--red-critical)';
    if(em.type==='PERIODIC'){
      const n = 30;
      for(let i=0;i<n;i++){ if(r()>0.1){ const x=padL+plotW*i/n; svg+=`<rect x="${x}" y="${y+2}" width="2" height="${rowH-5}" fill="${color}" opacity="0.75"/>`; } }
    } else if(em.type==='SCANNING'){
      const n=5;
      for(let i=0;i<n;i++){ if(r()>0.3){ const x=padL+plotW*(i/n)+r()*20; const w=plotW/n*0.5; svg+=`<rect x="${x}" y="${y+2}" width="${w}" height="${rowH-5}" fill="${color}" opacity="0.6"/>`; } }
    } else if(em.type==='INTERMITTENT'){
      const n=8;
      for(let i=0;i<n;i++){ if(r()>0.55){ const x=padL+r()*plotW*0.92; const w=6+r()*14; svg+=`<rect x="${x}" y="${y+2}" width="${w}" height="${rowH-5}" fill="${color}" opacity="0.7"/>`; } }
    } else { // AGILE - show as small hop ticks at varying heights within row
      const n=16;
      for(let i=0;i<n;i++){ if(r()>0.2){ const x=padL+plotW*i/n; const hOff=(r()-0.5)*(rowH-6); svg+=`<circle cx="${x}" cy="${y+rowH/2+hOff}" r="1.6" fill="${color}" opacity="0.85"/>`; } }
    }
  });
  svg += `</svg>`;
  return svg;
}

let pdwInterval = null;
function wirePDWStream(){
  document.getElementById('btnPdwPause')?.addEventListener('click',(e)=>{
    pdwPaused = !pdwPaused;
    e.target.textContent = pdwPaused?'▶ RESUME':'❙❙ PAUSE';
  });
  if(pdwInterval) clearInterval(pdwInterval);
  let counter = 2000;
  pdwInterval = setInterval(()=>{
    if(pdwPaused || currentPage!=='pdw') return;
    const body = document.getElementById('pdwBody');
    if(!body) return;
    const row = genPDWStream(1, counter++)[0];
    body.insertAdjacentHTML('afterbegin', pdwRowHtml(row));
    if(body.children.length>60) body.removeChild(body.lastChild);
  }, 900);
}

function renderErrorBarChart(width,height,values,errors,labels,color='var(--cyan-signal)'){
  const padL=40,padR=10,padT=10,padB=22;
  const plotW=width-padL-padR, plotH=height-padT-padB;
  const max = Math.max(...values.map((v,i)=>v+errors[i]))*1.15;
  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">`;
  svg += `<rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="var(--bg-panel-deep)"/>`;
  for(let i=0;i<=4;i++){
    const y = padT+plotH*i/4;
    svg += `<line x1="${padL}" y1="${y}" x2="${padL+plotW}" y2="${y}" stroke="var(--grid-line)" stroke-width="1"/>`;
  }
  const bw = plotW/values.length;
  values.forEach((v,i)=>{
    const h = plotH*(v/max);
    const x = padL+i*bw+bw*0.2;
    const barW = bw*0.6;
    const errH = plotH*(errors[i]/max);
    const topY = padT+plotH-h;
    svg += `<rect x="${x}" y="${topY}" width="${barW}" height="${h}" fill="${color}" opacity="0.8"/>`;
    svg += `<line x1="${x+barW/2}" y1="${topY-errH}" x2="${x+barW/2}" y2="${topY+errH}" stroke="var(--text-primary)" stroke-width="1.2"/>`;
    svg += `<line x1="${x+barW/2-4}" y1="${topY-errH}" x2="${x+barW/2+4}" y2="${topY-errH}" stroke="var(--text-primary)" stroke-width="1.2"/>`;
    svg += `<line x1="${x+barW/2-4}" y1="${topY+errH}" x2="${x+barW/2+4}" y2="${topY+errH}" stroke="var(--text-primary)" stroke-width="1.2"/>`;
    svg += `<text x="${x+barW/2}" y="${height-6}" text-anchor="middle" font-family="var(--font-mono)" font-size="7.5" fill="var(--text-dim)">${labels[i]}</text>`;
  });
  svg += `</svg>`;
  return svg;
}
